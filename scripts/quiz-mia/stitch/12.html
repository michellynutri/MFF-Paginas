<!-- Pinned Bottom CTA -->
<div class="fixed bottom-0 left-0 right-0 max-w-[390px] mx-auto p-4 bg-gradient-to-t from-surface via-surface/95 to-transparent pointer-events-none z-20">
<button class="pointer-events-auto w-full py-3.5 px-6 rounded-full bg-primary-container text-on-primary font-button-label text-button-label text-center shadow-md active:scale-[0.99] transition-transform" id="cta-button" type="button">
      Continuar · 2 marcados
    </button>
</div>
</div>
<script>
  (function() {
    const tiles = document.querySelectorAll('.quiz-tile');
    const cta = document.getElementById('cta-button');

    function updateCTA() {
      let count = 0;
      tiles.forEach(tile => {
        if (tile.dataset.id !== '5' && tile.dataset.selected === 'true') {
          count++;
        }
      });
      const noneTile = document.querySelector('[data-id="5"]');
      if (noneTile && noneTile.dataset.selected === 'true') {
        cta.textContent = 'Continuar';
      } else if (count === 0) {
        cta.textContent = 'Continuar';
      } else if (count === 1) {
        cta.textContent = 'Continuar · 1 marcado';
      } else {
        cta.textContent = `Continuar · ${count} marcados`;
      }
    }

    tiles.forEach(tile => {
      tile.addEventListener('click', () => {
        const isNone = tile.dataset.id === '5';
        const isSelected = tile.dataset.selected === 'true';

        if (isNone) {
          tiles.forEach(t => {
            if (t !== tile) applyStyle(t, false);
          });
          applyStyle(tile, !isSelected);
        } else {
          const noneTile = document.querySelector('[data-id="5"]');
          if (noneTile) applyStyle(noneTile, false);
          applyStyle(tile, !isSelected);
        }
        updateCTA();
      });
    });

    function applyStyle(tile, select) {
      tile.dataset.selected = select ? 'true' : 'false';
      const indicator = tile.querySelector('.checkbox-indicator');
      if (select) {
        tile.classList.remove('bg-surface-container-lowest');
        tile.classList.add('bg-secondary-fixed/30');
        tile.style.boxShadow = 'inset 0 0 0 2px #203E35';
        indicator.className = 'checkbox-indicator w-[22px] h-[22px] rounded-[6px] bg-secondary-fixed-dim flex items-center justify-center text-on-primary';
        indicator.style.boxShadow = 'none';
        indicator.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
      } else {
        tile.classList.remove('bg-secondary-fixed/30');
        tile.classList.add('bg-surface-container-lowest');
        tile.style.boxShadow = 'inset 0 0 0 1px #E4E8E1, 0 1px 2px rgba(0,0,0,0.03)';
        indicator.className = 'checkbox-indicator w-[22px] h-[22px] rounded-[6px] bg-transparent';
        indicator.style.boxShadow = 'inset 0 0 0 2px #DDE3DA';
        indicator.innerHTML = '';
      }
    }
  })();
</script></main>
