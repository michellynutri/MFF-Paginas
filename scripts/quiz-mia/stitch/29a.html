<div class="absolute inset-0 rounded-full" style="background: radial-gradient(circle at 65% 75%, rgba(217, 164, 65, 0.22) 0%, transparent 60%);"></div>
</div>
</div>

<div class="text-center px-2">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary-container tracking-tight" style="line-height: 1.25;">

    </p>

<div class="flex justify-center items-center mt-7">
<div class="relative overflow-hidden cursor-pointer" id="scratchCard" style="width: 330px; height: 200px; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(32, 62, 53, 0.08), 0 8px 10px -6px rgba(32, 62, 53, 0.04);">

</div>

</div>

</div>

      Revelar sem raspar
    </button>
</div>

<script>
  // Soft tactile interaction feedback on intact scratch surface
  (function() {
    const card = document.getElementById('scratchCard');
    if (!card) return;

    let isScratching = false;

    const startInteraction = () => { isScratching = true; };
    const stopInteraction = () => { isScratching = false; };

    card.addEventListener('mousedown', startInteraction);
    card.addEventListener('touchstart', startInteraction, { passive: true });
    window.addEventListener('mouseup', stopInteraction);
    window.addEventListener('touchend', stopInteraction);
  })();
</script></main></body></html>
