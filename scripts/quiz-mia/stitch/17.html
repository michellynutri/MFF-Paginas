<button class="w-full h-[52px] rounded-full bg-primary-container text-on-primary font-button-label text-[16px] font-semibold flex items-center justify-center shadow-md active:scale-[0.99] transition-transform" id="submit-btn" type="button">

<script>
  (function() {
    const stack = document.getElementById('options-stack');
    const btnText = document.getElementById('btn-text');
    if (!stack || !btnText) return;

    const cards = Array.from(stack.querySelectorAll('.quiz-option'));

    function updateCardVisuals(card, isSelected) {
      const indicator = card.querySelector('.checkbox-indicator');
      const checkIcon = indicator ? indicator.querySelector('.material-symbols-outlined') : null;

      if (isSelected) {
        card.style.outline = '1.5px solid #203E35';
        card.classList.remove('bg-white');
        card.classList.add('bg-[#FBF1DC]');
        if (indicator) {
          indicator.classList.remove('bg-transparent');
          indicator.classList.add('bg-[#D9A441]');
          indicator.style.outline = 'none';
        }
        if (checkIcon) {
          checkIcon.classList.remove('text-transparent');
          checkIcon.classList.add('text-white');
        }
      } else {
        card.style.outline = '1px solid #E5E9E2';
        card.classList.remove('bg-[#FBF1DC]');
        card.classList.add('bg-white');
        if (indicator) {
          indicator.classList.remove('bg-[#D9A441]');
          indicator.classList.add('bg-transparent');
          indicator.style.outline = '1.5px solid #DDE3DA';
        }
        if (checkIcon) {
          checkIcon.classList.remove('text-white');
          checkIcon.classList.add('text-transparent');
        }
      }
    }

    function syncState() {
      const selectedCards = cards.filter(c => c.dataset.selected === 'true');
      const count = selectedCards.length;
      if (count === 0) {
        btnText.textContent = 'Continuar';
      } else if (count === 1) {
        btnText.textContent = 'Continuar · 1 marcado';
      } else {
        btnText.textContent = 'Continuar · ' + count + ' marcados';
      }
    }

    cards.forEach(card => {
      // Initialize based on starting visual
      if (card.dataset.val === 'lactose') {
        card.dataset.selected = 'true';
      } else {
        card.dataset.selected = 'false';
      }

      card.addEventListener('click', () => {
        const val = card.dataset.val;
        const currentlySelected = card.dataset.selected === 'true';

        if (val === 'tudo') {
          // If 'Como de tudo' is clicked, unselect others
          cards.forEach(c => {
            c.dataset.selected = 'false';
            updateCardVisuals(c, false);
          });
          card.dataset.selected = (!currentlySelected).toString();
          updateCardVisuals(card, !currentlySelected);
        } else {
          // If another item is clicked, ensure 'Como de tudo' is unselected
          const tudoCard = cards.find(c => c.dataset.val === 'tudo');
          if (tudoCard && tudoCard.dataset.selected === 'true') {
            tudoCard.dataset.selected = 'false';
            updateCardVisuals(tudoCard, false);
          }
          card.dataset.selected = (!currentlySelected).toString();
          updateCardVisuals(card, !currentlySelected);
        }

        syncState();
      });
    });
  })();
</script></main>
