<!DOCTYPE html><html lang="pt-BR"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>V4 · 04 O que você mais quer</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              ink: '#203E35',
              subtle: '#56654D',
              accent: '#D9A441',
              border: '#DDE3DA',
              bg: '#F6F7F4',
              cardBg: '#FFFFFF',
              barTrack: '#E5E8E2'
            }
          },
          fontFamily: {
            sans: ['Geist', 'sans-serif']
          }
        }
      }
    };
  </script>
<style>
    body {
      font-family: 'Geist', sans-serif;
      background-color: #F6F7F4;
      color: #203E35;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .orb-logo {
      width: 28px;
      height: 28px;
      border-radius: 9999px;
      background: radial-gradient(circle at 35% 30%, #A2BCA9 0%, #7F9A86 55%, #597360 100%);
      box-shadow: 2px 3px 6px -1px rgba(217, 164, 65, 0.45), 0 1px 3px rgba(32, 62, 53, 0.15);
      position: relative;
    }
    .orb-logo::after {
      content: '';
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 11px;
      height: 11px;
      border-radius: 9999px;
      background: radial-gradient(circle, rgba(217, 164, 65, 0.7) 0%, transparent 70%);
      filter: blur(1px);
    }
  </style>

<body class="min-h-screen bg-[#F6F7F4] flex justify-center text-[#203E35]">

<!-- Top Navigation / Header -->
<header class="w-full mb-6"><div class="h-11 flex items-center justify-between relative mb-2">
  <button aria-label="Voltar" class="p-1 -ml-1 text-[#203E35] hover:opacity-75 transition-opacity" type="button">
    <svg fill="none" height="22" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="22">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>
  <div class="absolute left-1/2 -translate-x-1/2 flex items-center justify-center">

  </div>
  <div aria-hidden="true" class="w-[22px] h-[22px]"></div>
</div>
<div class="grid grid-cols-4 gap-2 mb-2">
  <div class="h-1 bg-[#E5E8E2] rounded-full overflow-hidden">
    <div class="h-full bg-[#D9A441] rounded-full" style="width: 60%;"></div>
  </div>
  <div class="h-1 bg-[#E5E8E2] rounded-full"></div>
  <div class="h-1 bg-[#E5E8E2] rounded-full"></div>
  <div class="h-1 bg-[#E5E8E2] rounded-full"></div>
</div>
<p class="text-[12px] text-[#56654D] tracking-normal font-normal">
  O seu momento na caneta
</p></header>

<!-- Option Cards -->
<section class="flex flex-col gap-4"><div class="flex flex-col gap-3">
  <div class="w-full bg-white rounded-[14px] border border-[#DDE3DA] p-[16px_18px] flex items-center justify-between cursor-pointer shadow-[0_1px_2px_rgba(0,0,0,0.02)]">
    <span class="text-[16px] font-medium text-[#203E35] leading-snug pr-3">
      Perder mais gordura sem subir a dose
    </span>
    <div class="w-[22px] h-[22px] rounded-full border-[1.5px] border-[#DDE3DA] flex-shrink-0"></div>
  </div>
  <div class="w-full bg-white rounded-[14px] border border-[#DDE3DA] p-[16px_18px] flex items-center justify-between cursor-pointer shadow-[0_1px_2px_rgba(0,0,0,0.02)]">

      Parar de passar mal depois da aplicação
    </span>
    <div class="w-[22px] h-[22px] rounded-full border-[1.5px] border-[#DDE3DA] flex-shrink-0"></div>
  </div>
  <div class="w-full bg-white rounded-[14px] border border-[#DDE3DA] p-[16px_18px] flex items-center justify-between cursor-pointer shadow-[0_1px_2px_rgba(0,0,0,0.02)]">

  </div>

    <span class="text-[16px] font-medium text-[#203E35] leading-snug pr-3">
      Parar a caneta e não engordar tudo de novo
    </span>
    <div class="w-[22px] h-[22px] rounded-full border-[1.5px] border-[#DDE3DA] flex-shrink-0"></div>
  </div>
</div></section>
<!-- Calm empty space below; no button, no footer text -->
<div class="flex-1 min-h-[120px]"></div>

</body></html>
