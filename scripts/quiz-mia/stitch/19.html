<div class="flex flex-col items-center w-full flex-1 justify-between pt-2" id="water-bottle-control"><div class="flex flex-col items-center w-full"><div class="relative flex items-center justify-center mb-6 pl-12"><div class="flex flex-col items-center"><div class="w-8 h-3.5 bg-[#426B56] rounded-t-[6px] mb-[1px]"></div><div class="relative w-[120px] h-[220px] bg-white rounded-t-[28px] rounded-b-[32px] border-2 border-[#426B56] overflow-hidden flex flex-col justify-end shadow-sm"><div class="w-full h-[60%] bg-[#82C1CF] transition-all duration-300"></div></div></div><div class="flex flex-col justify-between h-[220px] ml-4 py-2"><div class="flex items-center gap-1.5"><div class="w-2.5 h-[1.5px] bg-[#56654D]"></div><span class="text-[11px] leading-none text-[#56654D] font-medium font-sans">2,5 L</span></div><div class="flex items-center gap-1.5"><div class="w-2.5 h-[1.5px] bg-[#56654D]"></div><span class="text-[11px] leading-none text-[#56654D] font-medium font-sans">2 L</span></div><div class="flex items-center gap-1.5"><div class="w-2.5 h-[1.5px] bg-[#56654D]"></div><span class="text-[11px] leading-none text-[#56654D] font-medium font-sans">1,5 L</span></div><div class="flex items-center gap-1.5"><div class="w-2.5 h-[1.5px] bg-[#56654D]"></div><span class="text-[11px] leading-none text-[#56654D] font-medium font-sans">1 L</span></div><div class="flex items-center gap-1.5"><div class="w-2.5 h-[1.5px] bg-[#56654D]"></div><span class="text-[11px] leading-none text-[#56654D] font-medium font-sans">0,5 L</span></div></div></div><div class="flex flex-col items-center mb-6"><span class="text-[32px] font-semibold leading-[38px] text-[#203E35] font-sans">1,5 L</span><span class="text-[13px] leading-tight text-[#56654D] font-sans">por dia</span></div><div class="flex items-center justify-center gap-3 w-full mb-5"><button type="button" class="flex-1 h-12 bg-white border border-[#DDE3DA] rounded-2xl text-[15px] font-semibold text-[#203E35] flex items-center justify-center active:scale-95 transition-transform font-sans shadow-sm">− 250 ml</button><button type="button" class="flex-1 h-12 bg-white border border-[#DDE3DA] rounded-2xl text-[15px] font-semibold text-[#203E35] flex items-center justify-center active:scale-95 transition-transform font-sans shadow-sm">+ 250 ml</button></div><button type="button" class="text-[14px] text-[#426B56] underline font-sans hover:opacity-80 transition-opacity">Não faço ideia</button></div></div>
</div>
<script>
  (function() {
    const container = document.getElementById('water-options');
    if (!container) return;
    const buttons = container.querySelectorAll('button[role="radio"]');

    buttons.forEach((btn) => {
      btn.addEventListener('click', () => {
        buttons.forEach((b) => {
          b.setAttribute('aria-checked', 'false');
          b.classList.remove('bg-surface-container-low');
          const indicator = b.querySelector('span[aria-hidden="true"]');
          if (indicator) {
            indicator.className = 'flex-shrink-0 w-5 h-5 rounded-full bg-surface-container-highest flex items-center justify-center p-[2px] transition-colors';
            const inner = indicator.querySelector('span');
            if (inner) inner.className = 'w-full h-full rounded-full bg-surface-container-lowest transition-transform';
          }
        });

        btn.setAttribute('aria-checked', 'true');
        btn.classList.add('bg-surface-container-low');
        const activeIndicator = btn.querySelector('span[aria-hidden="true"]');
        if (activeIndicator) {
          activeIndicator.className = 'flex-shrink-0 w-5 h-5 rounded-full bg-primary-container flex items-center justify-center p-[4px] transition-colors';
          const inner = activeIndicator.querySelector('span');
          if (inner) inner.className = 'w-full h-full rounded-full bg-surface-container-lowest transition-transform scale-100';
        }
      });
    });
  })();
</script><div class="sticky bottom-5 left-0 right-0 w-full pt-4 mt-auto"><button type="button" class="w-full h-[54px] bg-[#203E35] text-white rounded-2xl font-semibold text-[16px] flex items-center justify-center active:scale-[0.99] transition-transform font-sans shadow-sm">Continuar</button></div></main>
