s-center justify-between max-w-[520px] mx-auto w-full"><button aria-label="Go back" class="w-11 h-11 -ml-2 flex items-center justify-center text-on-surface hover:text-on-surface-variant transition-colors active:opacity-70" onclick="history.back()"><span class="material-symbols-outlined text-[22px]">arrow_back_ios_new</span></button><div class="flex items-center justify-center flex-1"><div class="w-7 h-7 rounded-full shadow-[inset_-2px_-2px_6px_rgba(8,40,32,0.45),inset_2px_2px_6px_rgba(200,234,221,0.65),0_2px_6px_rgba(32,62,53,0.18)] bg-gradient-to-br from-[#c8eadd] via-[#46645a] to-[#203e35]"></div></div><div class="w-11 h-11 -mr-2"></div></div></header><main class="flex-1 flex flex-col relative w-full max-w-[520px] mx-auto px-margin pt-14 pb-28 bg-surface"><div class="flex flex-col w-full max-w-[390px] mx-auto min-w-0">

<span class="font-body-md text-[12px] leading-none text-[#56654D]">alertas</span>
<div class="flex items-center gap-1">
<span class="w-[6px] h-[6px] rounded-full bg-[#A1312A] block"></span>
<span class="w-[6px] h-[6px] rounded-full bg-[#A1312A] block"></span>
<span class="w-[6px] h-[6px] rounded-full bg-[#A1312A] block"></span>
</div>
</div>
</div>
</div>
<!-- Content Headings -->
<h1 class="font-body-md text-[24px] font-semibold text-[#203E35] leading-tight tracking-[-0.01em]">
    Agora, a sua idade e a sua altura.
  </h1>
<p class="font-body-md text-[14px] leading-[1.4] text-[#56654D] mt-2">

  </p>
<!-- Stepper Card -->
<div class="mt-6 w-full bg-surface-container-lowest rounded-[16px] shadow-[0_2px_8px_rgba(0,0,0,0.03)] overflow-hidden"><!-- Row 1: Idade -->
<div class="p-4 flex items-center justify-between">
<div class="flex flex-col">
<span class="font-body-md text-[13px] font-medium text-[#56654D] leading-none mb-1.5">Idade</span>
<div class="flex items-baseline">
<span class="font-body-md text-[26px] font-semibold text-[#203E35] leading-none" id="val-idade">42</span>
<span class="font-body-md text-[16px] font-medium text-[#56654D] ml-0.5">anos</span>
</div>
</div>
<div class="flex items-center gap-[10px]">
<button class="w-11 h-11 rounded-full bg-[#EDF0E9] flex items-center justify-center text-[22px] font-medium text-primary-container active:scale-95 transition-transform select-none" onclick="stepVal('val-idade', -1, 0, 'anos')" type="button">−</button>
<button class="w-11 h-11 rounded-full bg-[#EDF0E9] flex items-center justify-center text-[22px] font-medium text-primary-container active:scale-95 transition-transform select-none" onclick="stepVal('val-idade', 1, 0, 'anos')" type="button">+</button>

</div>

</div>

<button class="w-11 h-11 rounded-full bg-[#EDF0E9] flex items-center justify-center text-[22px] font-medium text-primary-container active:scale-95 transition-transform select-none" onclick="stepVal('val-altura', 0.01, 2, 'm')" type="button">+</button>

<script>
  function stepVal(id, delta, decimals, unit) {
    const el = document.getElementById(id);
    if (!el) return;
    let current = parseFloat(el.textContent.replace(',', '.'));
    if (isNaN(current)) return;
    let next = current + delta;
    if (unit === 'm' && (next < 1.0 || next > 2.3)) return;
    if (unit === 'kg' && (next < 30 || next > 250)) return;
    if (unit === 'anos' && (next < 14 || next > 105)) return;
    
    if (decimals > 0) {
      el.textContent = next.toFixed(decimals).replace('.', ',');
    } else {
      el.textContent = Math.round(next).toString();
    }
  }
</script></main><footer class="fixed bottom-0 w-full z-50 pb-safe bg-surface/80 backdrop-blur-xl shadow-[0_-2px_12px_rgba(32,62,53,0.03)]"><div class="max-w-[520px] mx-auto px-margin py-space-md flex flex-col gap-space-xs"><button class="w-full h-[54px] rounded-full bg-[#203E35] text-on-primary font-button-label text-[16px] font-semibold shadow-[0_4px_12px_rgba(32,62,53,0.2)] active:scale-[0.99] transition-transform flex items-center justify-center" type="button">Continuar</button></div></footer>
