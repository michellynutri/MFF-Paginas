<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V4 · 22b Peso hoje e meta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Geist', sans-serif;
      background-color: #F6F7F4;
      color: #203E35;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .sphere-logo {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #689D82 0%, #355C4A 55%, #183329 100%);
      box-shadow: 0 0 12px rgba(217, 164, 65, 0.35), inset -2px -2px 5px rgba(0, 0, 0, 0.45), inset 2px 2px 4px rgba(255, 255, 255, 0.35);
    }
  </style>
</head>
<body class="min-h-screen flex justify-center bg-[#F6F7F4]">
  <div class="w-[390px] min-h-screen bg-[#F6F7F4] flex flex-col justify-between relative px-5 pt-4 pb-6 box-border">
    
    <!-- Top Header Area -->
    <div>
      <!-- Top Navigation: Back Chevron & MIA Sphere Logo -->
      <div class="relative flex items-center justify-center h-10 mb-3">
        <button type="button" aria-label="Voltar" class="absolute left-0 top-1/2 -translate-y-1/2 w-10 h-10 flex items-center justify-center text-[#203E35] focus:outline-none">
          <span class="material-symbols-outlined text-[24px]">chevron_left</span>
        </button>
        <div class="sphere-logo" aria-label="MIA logo"></div>
      </div>

      <!-- 4-segment progress bar -->
      <!-- Segments 1-3 full #D9A441, segment 4 filled 40% -->
      <div class="grid grid-cols-4 gap-1.5 w-full mb-2">
        <div class="h-1 bg-[#D9A441] rounded-full"></div>
        <div class="h-1 bg-[#D9A441] rounded-full"></div>
        <div class="h-1 bg-[#D9A441] rounded-full"></div>
        <div class="h-1 bg-[#DDE3DA] rounded-full overflow-hidden">
          <div class="h-full bg-[#D9A441] w-[40%] rounded-full"></div>
        </div>
      </div>

      <!-- Chapter and Alert Status -->
      <div class="flex items-center justify-between text-[12px] font-medium text-[#56654D] mb-6">
        <span>O seu plano</span>
        <div class="flex items-center gap-1.5">
          <span>alertas</span>
          <div class="flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-[#A1312A]"></span>
            <span class="w-1.5 h-1.5 rounded-full bg-[#A1312A]"></span>
            <span class="w-1.5 h-1.5 rounded-full bg-[#A1312A]"></span>
          </div>
        </div>
      </div>

      <!-- Title & Caption -->
      <div class="mb-6">
        <h1 class="text-[24px] font-semibold leading-[1.25] text-[#203E35] mb-2 tracking-tight">
          E o seu peso: hoje e onde você quer chegar.
        </h1>
        <p class="text-[16px] leading-[1.4] text-[#56654D]">
          Com eles o plano calcula os nutrientes, a ingestão de água e as suas porções.
        </p>
      </div>

      <!-- White Card with Steppers -->
      <div class="bg-white rounded-[16px] shadow-sm border border-[#E8EDE6] p-4 mb-3">
        <!-- Row 1: Peso hoje -->
        <div class="flex items-center justify-between py-2 pb-4">
          <div class="flex flex-col">
            <span class="text-[13px] text-[#56654D] mb-0.5">Peso hoje</span>
            <span class="text-[26px] font-semibold text-[#203E35] leading-none">82 kg</span>
          </div>
          <div class="flex items-center gap-2">
            <button type="button" aria-label="Diminuir peso hoje" class="w-[44px] h-[44px] rounded-full bg-[#EDF0E9] text-[#203E35] text-[22px] font-medium flex items-center justify-center active:bg-[#e2e7dd] transition-colors focus:outline-none">
              −
            </button>
            <button type="button" aria-label="Aumentar peso hoje" class="w-[44px] h-[44px] rounded-full bg-[#EDF0E9] text-[#203E35] text-[22px] font-medium flex items-center justify-center active:bg-[#e2e7dd] transition-colors focus:outline-none">
              +
            </button>
          </div>
        </div>

        <!-- Hairline Divider -->
        <div class="h-[1px] bg-[#EEF2EC] w-full"></div>

        <!-- Row 2: Peso que você quer chegar -->
        <div class="flex items-center justify-between py-2 pt-4">
          <div class="flex flex-col">
            <span class="text-[13px] text-[#56654D] mb-0.5">Peso que você quer chegar</span>
            <span class="text-[26px] font-semibold text-[#203E35] leading-none">68 kg</span>
          </div>
          <div class="flex items-center gap-2">
            <button type="button" aria-label="Diminuir meta de peso" class="w-[44px] h-[44px] rounded-full bg-[#EDF0E9] text-[#203E35] text-[22px] font-medium flex items-center justify-center active:bg-[#e2e7dd] transition-colors focus:outline-none">
              −
            </button>
            <button type="button" aria-label="Aumentar meta de peso" class="w-[44px] h-[44px] rounded-full bg-[#EDF0E9] text-[#203E35] text-[22px] font-medium flex items-center justify-center active:bg-[#e2e7dd] transition-colors focus:outline-none">
              +
            </button>
          </div>
        </div>
      </div>

      <!-- Highlight Note -->
      <div class="bg-[#FBF1DC] rounded-[12px] px-4 py-3 mb-4">
        <p class="text-[14px] text-[#8A6418] font-medium leading-snug">
          São 14 kg até a sua meta.
        </p>
      </div>

      <!-- Lock Info Row -->
      <div class="flex items-center justify-center gap-1.5 text-[12px] text-[#56654D]">
        <span class="material-symbols-outlined text-[15px] text-[#56654D]">lock</span>
        <span>usados só para calcular o seu plano</span>
      </div>
    </div>

    <!-- Pinned Bottom CTA -->
    <div class="w-full pt-4">
      <button type="button" class="w-full h-[52px] bg-[#203E35] text-white rounded-[14px] font-semibold text-[16px] flex items-center justify-center active:bg-[#183329] transition-colors shadow-sm focus:outline-none">
        Continuar
      </button>
    </div>

  </div>
</body>
</html>
