<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V4 · 15 Quem faz a comida</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#203E35',
              muted: '#56654D',
              gold: '#D9A441',
              red: '#A1312A',
              border: '#DDE3DA',
              bg: '#F9FAF7'
            }
          },
          fontFamily: {
            sans: ['Geist', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #F9FAF7;
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #203E35;
      -webkit-font-smoothing: antialiased;
    }
    .sphere-orb {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #A9C2B0 0%, #708F79 50%, #4D6D56 85%, #344C3B 100%);
      box-shadow: 0 2px 6px rgba(32, 62, 53, 0.18), inset 0 1px 2px rgba(255, 255, 255, 0.45);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between max-w-[390px] mx-auto px-5 pt-4 pb-8 select-none">
  <!-- Top Navigation & Header -->
  <div>
    <!-- Bar with back chevron and centered sphere logo -->
    <header class="relative flex items-center justify-between h-9 mb-4">
      <button type="button" aria-label="Voltar" class="text-brand-dark hover:opacity-75 transition-opacity p-1 -ml-1">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6" />
        </svg>
      </button>

      <!-- MIA 28px sphere orb centered -->
      <div class="absolute left-1/2 -translate-x-1/2">
        <div class="sphere-orb"></div>
      </div>

      <div class="w-6"></div>
    </header>

    <!-- 4-segment progress bar -->
    <!-- First two segments full gold, third 15% gold, fourth empty -->
    <div class="grid grid-cols-4 gap-1.5 mb-2">
      <!-- Segment 1: 100% gold -->
      <div class="h-1 bg-[#DDE3DA] rounded-full overflow-hidden">
        <div class="h-full bg-brand-gold w-full rounded-full"></div>
      </div>
      <!-- Segment 2: 100% gold -->
      <div class="h-1 bg-[#DDE3DA] rounded-full overflow-hidden">
        <div class="h-full bg-brand-gold w-full rounded-full"></div>
      </div>
      <!-- Segment 3: 15% gold -->
      <div class="h-1 bg-[#DDE3DA] rounded-full overflow-hidden">
        <div class="h-full bg-brand-gold w-[15%] rounded-full"></div>
      </div>
      <!-- Segment 4: Empty -->
      <div class="h-1 bg-[#DDE3DA] rounded-full overflow-hidden">
        <div class="h-full bg-brand-gold w-0 rounded-full"></div>
      </div>
    </div>

    <!-- Chapter info and Alertas counter -->
    <div class="flex items-center justify-between text-[12px] text-brand-muted tracking-tight mb-8">
      <span>O que cabe no seu dia</span>
      <div class="flex items-center gap-1.5">
        <span class="font-normal text-brand-dark">alertas</span>
        <div class="flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-brand-red inline-block"></span>
          <span class="w-2 h-2 rounded-full bg-brand-red inline-block"></span>
          <span class="w-2 h-2 rounded-full bg-brand-red inline-block"></span>
        </div>
      </div>
    </div>

    <!-- Main Question / Title -->
    <h1 class="text-[24px] leading-[1.25] font-semibold text-brand-dark tracking-[-0.015em] mb-7">
      No dia a dia, quem faz a sua comida?
    </h1>

    <!-- 4 Single-choice option cards (None selected) -->
    <div class="space-y-3">
      <!-- Card 1 -->
      <div class="flex items-center justify-between bg-white rounded-2xl px-5 py-4 border border-brand-border/70 shadow-sm active:scale-[0.99] transition-all cursor-pointer">
        <span class="text-[16px] font-medium text-brand-dark">Eu mesma cozinho</span>
        <div class="w-5 h-5 rounded-full border border-brand-border bg-[#F3F5F2] flex-shrink-0"></div>
      </div>

      <!-- Card 2 -->
      <div class="flex items-center justify-between bg-white rounded-2xl px-5 py-4 border border-brand-border/70 shadow-sm active:scale-[0.99] transition-all cursor-pointer">
        <span class="text-[16px] font-medium text-brand-dark">Alguém cozinha para mim</span>
        <div class="w-5 h-5 rounded-full border border-brand-border bg-[#F3F5F2] flex-shrink-0"></div>
      </div>

      <!-- Card 3 -->
      <div class="flex items-center justify-between bg-white rounded-2xl px-5 py-4 border border-brand-border/70 shadow-sm active:scale-[0.99] transition-all cursor-pointer">
        <span class="text-[16px] font-medium text-brand-dark">Como fora ou peço</span>
        <div class="w-5 h-5 rounded-full border border-brand-border bg-[#F3F5F2] flex-shrink-0"></div>
      </div>

      <!-- Card 4 -->
      <div class="flex items-center justify-between bg-white rounded-2xl px-5 py-4 border border-brand-border/70 shadow-sm active:scale-[0.99] transition-all cursor-pointer">
        <span class="text-[16px] font-medium text-brand-dark">Levo marmita</span>
        <div class="w-5 h-5 rounded-full border border-brand-border bg-[#F3F5F2] flex-shrink-0"></div>
      </div>
    </div>
  </div>

  <!-- Calm empty space below (No button as requested) -->
  <div class="h-16"></div>
</body>
</html>
