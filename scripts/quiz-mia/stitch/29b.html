<script>
  // Soft tactile interaction feedback on intact scratch surface
  (function() {
    const card = document.getElementById('scratchCard');
    if (!card) return;

    let isScratching = false;

    const startInteraction = () => { isScratching = true; };
    const stopInteraction = () => { isScratching = false; };

    card.addEventListener('mousedown', startInteraction);
    card.addEventListener('touchstart', startInteraction, { passive: true });
    window.addEventListener('mouseup', stopInteraction);
    window.addEventListener('touchend', stopInteraction);
  })();
