<div class="fixed bottom-0 left-0 right-0 z-30 pointer-events-none">
<div class="max-w-[390px] mx-auto px-5 pb-6 pt-6 pointer-events-auto bg-gradient-to-t from-surface via-surface/95 to-transparent">
<button class="w-full h-12 bg-primary-container text-on-primary font-button-label text-button-label rounded-full flex items-center justify-center shadow-md active:opacity-90 active:scale-[0.99] transition-all" id="cta-button" type="button">

      </button>

<script>
  (function() {
    const tiles = document.querySelectorAll('.food-tile');
    const cta = document.getElementById('cta-button');

    function updateCTA() {
      const count = document.querySelectorAll('.food-tile[data-selected="true"]').length;
      cta.textContent = `Continuar · ${count} marcado${count === 1 ? '' : 's'}`;
    }

    tiles.forEach(tile => {
      tile.addEventListener('click', () => {
        const isSelected = tile.getAttribute('data-selected') === 'true';
        const indicator = tile.querySelector('.checkbox-indicator');

        if (isSelected) {
          tile.setAttribute('data-selected', 'false');
          tile.setAttribute('aria-checked', 'false');
          tile.classList.remove('bg-[#FBF1DC]');
          tile.classList.add('bg-surface-container-lowest');
          tile.style.boxShadow = 'inset 0 0 0 1px #E5E7EB';

          indicator.className = 'checkbox-indicator w-[22px] h-[22px] rounded-[6px] bg-surface-container-lowest transition-colors';
          indicator.style.boxShadow = 'inset 0 0 0 1.5px #c1c8c4';
          indicator.innerHTML = '';
        } else {
          tile.setAttribute('data-selected', 'true');
          tile.setAttribute('aria-checked', 'true');
          tile.classList.remove('bg-surface-container-lowest');
          tile.classList.add('bg-[#FBF1DC]');
          tile.style.boxShadow = 'inset 0 0 0 2px #203E35';

          indicator.className = 'checkbox-indicator w-[22px] h-[22px] rounded-[6px] bg-secondary flex items-center justify-center transition-colors';
          indicator.style.boxShadow = 'none';
          indicator.innerHTML = '<span class="material-symbols-outlined text-[15px] text-white select-none">check</span>';
        }

        updateCTA();
      });
    });
  })();
</script></main>
