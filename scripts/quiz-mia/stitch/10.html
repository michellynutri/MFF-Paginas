<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V4 · 10 Fome hoje</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F9FAF7;
      color: #203E35;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="min-h-screen bg-[#F9FAF7] text-[#203E35] flex flex-col justify-between selection:bg-[#D9A441]/20">
  <!-- Container 390px Mobile -->
  <div class="w-full max-w-[390px] mx-auto min-h-screen px-5 pt-3 pb-8 flex flex-col justify-between">
    
    <!-- Top Header -->
    <div>
      <!-- Nav row: Back chevron + Sphere logo centered -->
      <div class="relative flex items-center justify-between h-12 mb-3">
        <button type="button" aria-label="Voltar" class="p-2 -ml-2 text-[#203E35] hover:opacity-75 transition-opacity">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7" />
          </svg>
        </button>

        <!-- MIA Sphere Logo centered (28px sage green orb with gold glow, no text) -->
        <div class="absolute left-1/2 -translate-x-1/2 flex items-center justify-center">
          <div class="w-7 h-7 rounded-full shadow-[0_2px_8px_rgba(217,164,65,0.35)] relative overflow-hidden" 
               style="background: radial-gradient(circle at 35% 30%, #A3B899 0%, #768F70 55%, #465E43 100%);">
            <div class="absolute inset-0 rounded-full" style="background: radial-gradient(circle at 60% 80%, rgba(217, 164, 65, 0.45) 0%, transparent 60%);"></div>
            <div class="absolute top-[3px] left-[5px] w-2 h-1.5 rounded-full bg-white/40 blur-[0.6px]"></div>
          </div>
        </div>

        <!-- Spacer for alignment (no right button or avatar) -->
        <div class="w-9"></div>
      </div>

      <!-- 4-segment Progress Bar -->
      <!-- First segment full gold, second segment 50% gold, third & fourth empty -->
      <div class="grid grid-cols-4 gap-2 mb-2">
        <!-- Segment 1: 100% full gold -->
        <div class="h-1 bg-[#DDE3DA] rounded-full overflow-hidden">
          <div class="h-full bg-[#D9A441] w-full rounded-full"></div>
        </div>
        <!-- Segment 2: 50% gold -->
        <div class="h-1 bg-[#DDE3DA] rounded-full overflow-hidden">
          <div class="h-full bg-[#D9A441] w-1/2 rounded-full"></div>
        </div>
        <!-- Segment 3: 0% -->
        <div class="h-1 bg-[#DDE3DA] rounded-full overflow-hidden">
          <div class="h-full bg-[#D9A441] w-0 rounded-full"></div>
        </div>
        <!-- Segment 4: 0% -->
        <div class="h-1 bg-[#DDE3DA] rounded-full overflow-hidden">
          <div class="h-full bg-[#D9A441] w-0 rounded-full"></div>
        </div>
      </div>

      <!-- Progress Labels row: chapter name at left, alertas at right with 3 dots -->
      <!-- Dot 1: #A1312A, Dot 2: #A1312A, Dot 3: #DDE3DA -->
      <div class="flex items-center justify-between text-[12px] text-[#56654D] mb-7 font-normal">
        <span>Os avisos do seu corpo</span>
        <div class="flex items-center gap-1.5">
          <span>alertas</span>
          <div class="flex items-center gap-1 ml-0.5">
            <span class="w-2 h-2 rounded-full bg-[#A1312A] inline-block"></span>
            <span class="w-2 h-2 rounded-full bg-[#A1312A] inline-block"></span>
            <span class="w-2 h-2 rounded-full bg-[#DDE3DA] inline-block"></span>
          </div>
        </div>
      </div>

      <!-- Title: Geist sans 24px 600 -->
      <h1 class="text-[24px] leading-[1.25] font-semibold text-[#203E35] mb-6 tracking-tight">
        Como está a sua fome hoje?
      </h1>

      <!-- Four Single-Choice Option Cards (none selected, no button) -->
      <div class="flex flex-col gap-3">
        <!-- Option 1 -->
        <button type="button" class="w-full text-left bg-white rounded-2xl p-4 sm:p-4.5 border border-transparent shadow-[0_1px_3px_rgba(0,0,0,0.02)] hover:border-[#DDE3DA] transition-all flex items-center justify-between group active:scale-[0.99]">
          <span class="text-[15px] font-medium text-[#203E35] pr-3 leading-snug">
            Sumiu, eu até esqueço de comer
          </span>
          <span class="w-5 h-5 rounded-full bg-[#E5E9E2] flex-shrink-0 group-hover:bg-[#D5DCD0] transition-colors"></span>
        </button>

        <!-- Option 2 -->
        <button type="button" class="w-full text-left bg-white rounded-2xl p-4 sm:p-4.5 border border-transparent shadow-[0_1px_3px_rgba(0,0,0,0.02)] hover:border-[#DDE3DA] transition-all flex items-center justify-between group active:scale-[0.99]">
          <span class="text-[15px] font-medium text-[#203E35] pr-3 leading-snug">
            Pouca, em horários certos
          </span>
          <span class="w-5 h-5 rounded-full bg-[#E5E9E2] flex-shrink-0 group-hover:bg-[#D5DCD0] transition-colors"></span>
        </button>

        <!-- Option 3 -->
        <button type="button" class="w-full text-left bg-white rounded-2xl p-4 sm:p-4.5 border border-transparent shadow-[0_1px_3px_rgba(0,0,0,0.02)] hover:border-[#DDE3DA] transition-all flex items-center justify-between group active:scale-[0.99]">
          <span class="text-[15px] font-medium text-[#203E35] pr-3 leading-snug">
            Normal
          </span>
          <span class="w-5 h-5 rounded-full bg-[#E5E9E2] flex-shrink-0 group-hover:bg-[#D5DCD0] transition-colors"></span>
        </button>

        <!-- Option 4 -->
        <button type="button" class="w-full text-left bg-white rounded-2xl p-4 sm:p-4.5 border border-transparent shadow-[0_1px_3px_rgba(0,0,0,0.02)] hover:border-[#DDE3DA] transition-all flex items-center justify-between group active:scale-[0.99]">
          <span class="text-[15px] font-medium text-[#203E35] pr-3 leading-snug">
            Voltou com força nos últimos dias
          </span>
          <span class="w-5 h-5 rounded-full bg-[#E5E9E2] flex-shrink-0 group-hover:bg-[#D5DCD0] transition-colors"></span>
        </button>
      </div>

    </div>

    <!-- Calm empty space below (no button as specified) -->
    <div class="py-6"></div>

  </div>
</body>
</html>
