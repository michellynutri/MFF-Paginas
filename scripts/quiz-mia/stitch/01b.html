<script>
  function selectOption(selectedCard) {
    const buttons = document.querySelectorAll('div[role="radiogroup"] button');
    
    buttons.forEach(btn => {
      btn.setAttribute('aria-checked', 'false');
      btn.classList.remove('bg-surface-container-low');
      btn.classList.add('bg-surface-container-lowest');
      
      const indicator = btn.querySelector('.indicator');
      const dot = btn.querySelector('.dot');
      if (indicator) {
        indicator.classList.remove('bg-primary-container');
        indicator.classList.add('bg-surface-container-high');
      }
      if (dot) {
        dot.classList.remove('opacity-100', 'bg-on-primary');
        dot.classList.add('opacity-0', 'bg-primary-container');
      }
    });

    selectedCard.setAttribute('aria-checked', 'true');
    selectedCard.classList.remove('bg-surface-container-lowest');
    selectedCard.classList.add('bg-surface-container-low');
    
    const activeIndicator = selectedCard.querySelector('.indicator');
    const activeDot = selectedCard.querySelector('.dot');
    if (activeIndicator) {
      activeIndicator.classList.remove('bg-surface-container-high');
      activeIndicator.classList.add('bg-primary-container');
    }
    if (activeDot) {
      activeDot.classList.remove('opacity-0', 'bg-primary-container');
      activeDot.classList.add('opacity-100', 'bg-on-primary');
    }

    // Gentle auto-advance simulation
    setTimeout(() => {
      // In production pipeline, triggers next view transition
    }, 450);
  }
