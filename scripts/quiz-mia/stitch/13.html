  </head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased min-h-full flex flex-col justify-start items-center selection:bg-primary-fixed selection:text-on-primary-fixed"><main class="flex flex-col relative w-full max-w-[520px] min-h-screen px-margin pt-safe pb-safe bg-surface"><div class="flex flex-col w-full pb-8">

<div class="w-full flex items-center justify-between pt-2 pb-4">
<button aria-label="Voltar" class="w-9 h-9 flex items-center justify-start text-primary-container focus:outline-none" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24">
<polyline points="15 18 9 12 15 6"></polyline>
</svg>

<!-- Centered Sage Green Orb -->
<div class="w-7 h-7 rounded-full shadow-sm" style="background: radial-gradient(circle at 35% 30%, #89A99D 0%, #46645A 55%, #203E35 100%); box-shadow: 0 2px 6px -1px rgba(32, 62, 53, 0.25);"></div>
<!-- Empty balanced spacer -->
<div class="w-9 h-9"></div>
</div>
<!-- 4-Segment Progress Bar -->
<div class="w-full grid grid-cols-4 gap-1 mt-1 mb-2.5">
<!-- Segment 1: 100% Gold -->
<div class="h-1 rounded-full overflow-hidden" style="background-color: #D9A441;"></div>
<!-- Segment 2: 88% Gold, 12% Track -->
<div class="h-1 rounded-full overflow-hidden flex" style="background-color: #DDE3DA;">
<div class="h-full rounded-full" style="width: 88%; background-color: #D9A441;"></div>
</div>
<!-- Segment 3: 0% Empty Track -->
<div class="h-1 rounded-full" style="background-color: #DDE3DA;"></div>
<!-- Segment 4: 0% Empty Track -->
<div class="h-1 rounded-full" style="background-color: #DDE3DA;"></div>
</div>
<!-- Chapter Meta & Alerts -->
<div class="w-full flex items-center justify-between font-mono-sm text-caption mb-6" style="color: #56654D;">
<span>Os avisos do seu corpo</span>
<div class="flex items-center space-x-1.5">
<span class="mr-1">alertas</span>
<span class="w-2 h-2 rounded-full inline-block" style="background-color: #A1312A;"></span>
<span class="w-2 h-2 rounded-full inline-block" style="background-color: #A1312A;"></span>
<span class="w-2 h-2 rounded-full inline-block" style="background-color: #A1312A;"></span>
</div>
</div>
<!-- Question Title -->
<h1 class="font-question-lg text-primary-container text-[24px] leading-[1.25] font-semibold mb-6">
    Você pula refeição quando não está com fome?
  </h1>
<!-- Single Choice Options -->
<div class="w-full flex flex-col space-y-3" id="quiz-options-group">
<!-- Option 1: Selected -->
<div aria-checked="true" class="w-full flex items-center justify-between rounded-[16px] px-5 py-[18px] cursor-pointer transition-all duration-150 select-none shadow-sm" role="radio" style="background-color: #FBF1DC; border: 2px solid #203E35;" tabindex="0">
<span class="text-[16px] leading-[22px] font-medium" style="color: #203E35;">
        Quase todo dia
      </span>
<div class="w-[22px] h-[22px] rounded-full flex items-center justify-center shrink-0" style="background-color: #D9A441;">
<svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" viewbox="0 0 16 16">
<polyline points="3.5 8.5 6.5 11.5 12.5 4.5"></polyline>
</svg>
</div>
</div>
<!-- Option 2: Not Selected -->
<div aria-checked="false" class="w-full flex items-center justify-between rounded-[16px] px-5 py-[18px] cursor-pointer transition-all duration-150 select-none shadow-sm" role="radio" style="background-color: #FFFFFF; border: 1px solid #ECEEE9;" tabindex="0">
<span class="text-[16px] leading-[22px] font-medium" style="color: #203E35;">
        Às vezes
      </span>
<div class="w-5 h-5 rounded-full shrink-0" style="background-color: #DDE3DA;"></div>
</div>
<!-- Option 3: Not Selected -->
<div aria-checked="false" class="w-full flex items-center justify-between rounded-[16px] px-5 py-[18px] cursor-pointer transition-all duration-150 select-none shadow-sm" role="radio" style="background-color: #FFFFFF; border: 1px solid #ECEEE9;" tabindex="0">
<span class="text-[16px] leading-[22px] font-medium" style="color: #203E35;">
        Nunca
      </span>
<div class="w-5 h-5 rounded-full shrink-0" style="background-color: #DDE3DA;"></div>
</div>
</div>
<!-- Validation Note -->
<div class="w-full mt-4 p-4 rounded-[12px] flex items-start" style="background-color: #F8EFDC; color: #7A5619;">
<p class="text-[14px] leading-[1.4] m-0 font-normal">
      É o erro que a Dra. Michelly mais vê em quem usa caneta. A vontade de comer some, mas o corpo continua precisando de nutriente.
    </p>
</div>
</div>
<script>
  (function() {
    const container = document.getElementById('quiz-options-group');
    if (!container) return;

    const cards = container.querySelectorAll('[role="radio"]');

    cards.forEach((card) => {
      card.addEventListener('click', () => {
        cards.forEach((c) => {
          c.setAttribute('aria-checked', 'false');
          c.style.backgroundColor = '#FFFFFF';
          c.style.border = '1px solid #ECEEE9';
          
          const indicator = c.querySelector('div:last-child');
          if (indicator) {
            indicator.className = 'w-5 h-5 rounded-full shrink-0';
            indicator.style.backgroundColor = '#DDE3DA';
            indicator.innerHTML = '';
          }
        });

        card.setAttribute('aria-checked', 'true');
        card.style.backgroundColor = '#FBF1DC';
        card.style.border = '2px solid #203E35';

        const indicator = card.querySelector('div:last-child');
        if (indicator) {
          indicator.className = 'w-[22px] h-[22px] rounded-full flex items-center justify-center shrink-0';
          indicator.style.backgroundColor = '#D9A441';
          indicator.innerHTML = '<svg class="w-3.5 h-3.5 text-white" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="3.5 8.5 6.5 11.5 12.5 4.5"></polyline></svg>';
        }
      });
    });
  })();
</script></main></body></html>
